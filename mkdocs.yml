site_name: Engineering Notes
site_description: Working notes on applied AI systems, cloud platforms, and software engineering.
docs_dir: 'docs'
exclude_docs: |
  README.md
  *.py
  *.txt
hooks:
  - hooks.py        # To add space lines between title and unordered list in the markdown files
copyright: >
  AWS service descriptions, product definitions, and documentation excerpts
  belong to their respective owners (&copy; Amazon Web Services, Inc.).
  Used for personal, non-commercial study.
theme:
  name: material
  features:
    - navigation.indexes
    - navigation.top
    - content.code.copy
  palette:
  # Primary colors: red, pink, purple, deep purple, indigo, blue, light blue, cyan, teal, green, light green, lime, yellow, amber, orange, deep orange, brown, grey, blue grey, black, white.
  # Accent colors: red, pink, purple, deep purple, indigo, blue, light blue, cyan, teal, green, light green, lime, yellow, amber, orange, deep orange.
      # Dark Mode
      - scheme: slate
        primary: pink
        accent: red
        toggle:
          icon: material/brightness-4
          name: Switch to light mode
      # Light Mode
      - scheme: default
        primary: pink
        accent: red
        toggle:
          icon: material/brightness-7
          name: Switch to dark mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.smartsymbols    
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
        generic: true 

plugins:
  - awesome-pages
  - mkdocs-jupyter
  - search

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js